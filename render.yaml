services:
  - type: web
    name: sentinel-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "5"
    disk:
      name: sentinel-data
      mountPath: /srv/sentinel/data
      sizeGB: 1
